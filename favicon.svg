<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f6fb4"/>
      <stop offset="100%" stop-color="#19a7e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#g)" filter="url(#shadow)"/>
  <!-- plane icon — high quality, centered -->
  <g fill="white" transform="translate(64 64)">
    <!-- plane body -->
    <path d="M -38 -6 L 28 -22 L 30 -14 L 2 0 L 30 14 L 28 22 L -38 6 L -26 0 Z" opacity="0.98"/>
    <!-- tail fin -->
    <path d="M -22 -6 L -10 -18 L -2 -16 L -12 0 L -22 6 Z" opacity="0.95"/>
    <!-- window hint -->
    <circle cx="10" cy="-8" r="2.2" fill="white" opacity="0.92"/>
    <circle cx="16" cy="-10" r="2.2" fill="white" opacity="0.92"/>
  </g>
  <!-- shine highlight -->
  <path d="M 24 18 Q 36 12 48 22" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.22" fill="none"/>
</svg>
